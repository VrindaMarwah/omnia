---
# Upgrade from pre-fabrica OpenCHAMI (Omnia 2.1) to fabrica-based (Omnia 2.2)
# This task removes legacy services and then runs the full deploy flow.

- name: Stop openchami target
  ansible.builtin.systemd_service:
    name: openchami.target
    state: stopped
  failed_when: false

- name: Stop legacy containers
  ansible.builtin.command: "podman stop {{ item }}"
  loop: "{{ openchami_legacy_containers }}"
  changed_when: false
  failed_when: false

- name: Remove legacy containers
  ansible.builtin.command: "podman rm -f {{ item }}"
  loop: "{{ openchami_legacy_containers }}"
  changed_when: false
  failed_when: false

- name: Remove legacy container files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ openchami_legacy_container_files }}"

- name: Remove legacy podman secrets
  ansible.builtin.command: "podman secret rm {{ item }}"
  loop: "{{ openchami_legacy_secrets }}"
  changed_when: false
  failed_when: false

- name: Remove legacy container images
  ansible.builtin.command: "podman rmi {{ item }}"
  loop: "{{ openchami_legacy_images }}"
  changed_when: false
  failed_when: false

- name: Reload systemd after legacy cleanup
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Deploy new fabrica-based OpenCHAMI
  ansible.builtin.include_tasks: deploy_openchami.yml
